const KEY = "debbie_shortlist_v1";
let verdicts = JSON.parse(localStorage.getItem(KEY) || "{}");
let i = 0;
const img=document.getElementById("img"), pos=document.getElementById("pos"),
      fill=document.getElementById("fill"), meta=document.getElementById("meta"),
      tally=document.getElementById("tally"), flash=document.getElementById("flash"),
      done=document.getElementById("done");

function firstUndone(){
  for(let k=0;k<OBJ.length;k++){ if(!(OBJ[k].ra+"_"+OBJ[k].dec in verdicts)) return k; }
  return OBJ.length;
}
function counts(){
  const c={yes:0,no:0,amb:0,second:0};
  for(const v of Object.values(verdicts)) if(c[v.v]!==undefined) c[v.v]++;
  return c;
}
function show(){
  if(i>=OBJ.length){ finish(); return; }
  const o=OBJ[i];
  img.src=o.img; img.style.display="";
  pos.textContent=(i+1)+" / "+OBJ.length;
  fill.style.width=(100*Object.keys(verdicts).length/OBJ.length)+"%";
  meta.textContent=o.ra.toFixed(4)+" "+(o.dec>=0?"+":"")+o.dec.toFixed(4)
    +"   r_e="+o.r.toFixed(1)+"\\u2033   \\u03bc="+o.mu.toFixed(1);
  const c=counts();
  tally.innerHTML="<b>"+c.yes+"</b> yes &nbsp; <b>"+c.no+"</b> no &nbsp; <b>"
    +c.amb+"</b> ambig &nbsp; <b>"+c.second+"</b> 2nd";
}
function finish(){
  img.style.display="none"; meta.textContent=""; done.style.display="block";
  const c=counts(), n=c.yes+c.no;
  const p=n? (100*c.yes/n) : 0;
  const err=n? (196*Math.sqrt((p/100)*(1-p/100)/n)) : 0;
  done.innerHTML="<h2>Sample complete</h2>"
    +"<p><b>"+c.yes+"</b> galaxies, <b>"+c.no+"</b> not, <b>"+c.amb
    +"</b> ambiguous, <b>"+c.second+"</b> flagged</p>"
    +"<p style='font-size:20px'>purity = <b>"+p.toFixed(1)+"% &plusmn; "
    +err.toFixed(1)+"%</b><br><span style='font-size:13px;color:#889'>"
    +"(of "+n+" decided; ambiguous excluded)</span></p>"
    +"<p>Press <kbd>s</kbd> to download verdicts as JSON.</p>";
}
function mark(v){
  if(i>=OBJ.length) return;
  const o=OBJ[i];
  verdicts[o.ra+"_"+o.dec]={v:v,ra:o.ra,dec:o.dec,r:o.r,mu:o.mu,
                            t:new Date().toISOString()};
  localStorage.setItem(KEY,JSON.stringify(verdicts));
  flash.textContent={yes:"\\u2713",no:"\\u2715",amb:"?",second:"\\u26a0"}[v];
  flash.style.color={yes:"#5c8",no:"#c55",amb:"#dc6",second:"#59c"}[v];
  flash.style.opacity=1; setTimeout(()=>flash.style.opacity=0,120);
  i++; show();
}
function undo(){
  if(i<=0) return;
  i--; delete verdicts[OBJ[i].ra+"_"+OBJ[i].dec];
  localStorage.setItem(KEY,JSON.stringify(verdicts)); show();
}
function save(){
  const lines=Object.values(verdicts).map(v=>JSON.stringify(v)).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([lines],{type:"application/x-ndjson"}));
  a.download="shortlist_verdicts.jsonl"; a.click();
}
addEventListener("keydown",e=>{
  const k=e.key;
  if(k==="ArrowLeft"){mark("no");e.preventDefault();}
  else if(k==="ArrowRight"){mark("yes");e.preventDefault();}
  else if(k==="ArrowUp"){mark("amb");e.preventDefault();}
  else if(k==="ArrowDown"){mark("second");e.preventDefault();}
  else if(k==="z"){undo();}
  else if(k==="s"){save();}
});
// preload the next few so it never stalls between keypresses
function preload(){ for(let k=i+1;k<Math.min(i+8,OBJ.length);k++){
  const im=new Image(); im.src=OBJ[k].img; } }
setInterval(preload,400);
i=firstUndone(); show();
</script>
